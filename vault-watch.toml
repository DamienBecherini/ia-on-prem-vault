# Manifest of this guide for vault-watch-agent (https://github.com/DamienBecherini/vault-watch-agent): which pages,
# which mirror, which watch, rules and checks the agent uses. Format: docs/connect-your-guide.md of the agent.
schema = 1

[guide]
name = "Zero to Hero: On-Premise AI"
description = "running AI on-premise for SMEs (hardware sizing, inference engines, models, agents, security)"
repository = "DamienBecherini/ia-on-prem-vault"   # where issues and pull requests go
site = "https://ia-on-prem.damien.becherini.fr/"
base_branch = "main"

[content]
language = "fr"                                    # the language the pages are written in
include = ["**/*.md", "**/*.mdx"]
exclude = ["assets/**", "docs/**", "scripts/**", "_private/**", "_templates/**", "build/**", "public/**",
           "node_modules/**", "README.md", "CLAUDE.md", "AGENTS.md"]
mirrors = { en = "en/" }                           # translated copies kept in step (excluded from the pages)
modified_field = "last_modified"                   # front matter date bumped by an edit

[watch]
source = "github-issue"
label = "veille"
artifact = "weekly-watch"
feeds = ".agents/vault-maintenance/feeds.json"      # read by `vault-watch collect` (the weekly workflow and by hand)
seen = ".agents/vault-maintenance/watch-seen.md"     # items already triaged: their URLs are dropped
candidate_readers = ["huggingface", "github"]      # where candidates are read, no model (vault-watch-agent 1.7.0)
candidates = ".agents/vault-maintenance/candidates.json"
source_tiers = ".agents/vault-maintenance/source-tiers.md"  # candidates scored by their publishers' tiers (vault-watch-agent 1.8.0)

[rules]                                            # optional: the agent ships defaults
brief = ".agents/skills/vault-watch/brief.md"
translation_policy = ".agents/skills/vault-translate-content/references/translation-policy.md"

[checks]                                           # optional, each one; {out} = a JSON file the agent reads
audits = "node scripts/run-audits.mjs"
claims_due = "node scripts/audit-freshness.mjs --due-only --json={out}"
sources = "node scripts/audit-sources.mjs --concurrency=8 --timeout=15000 --json={out}"
sources_weekly = "freshness-report/sources.json"     # the weekly report of freshness.yml, crossed with the probe (1.8.0)
version_floors = { script = "scripts/audit-version-floors.mjs", file = ".agents/vault-maintenance/version-floors.json" }

# [budget] max_context_tokens: not set, the model's window decides (the guide is about 430 k tokens; a 1M
# window reads it whole). A ceiling below the guide's size would make the cross-check read it chapter by chapter.

# Chapters: the pages the agent works on together (exploration of the web, check of the translations,
# reading by chapter). A page goes to the first chapter that takes it; the pages none takes follow the
# automatic rule. Written from the interface (« Chapters ») or by `vault-watch chapters`; editable by hand.
[[chapter]]
name = "Accueil et projet"
paths = ["00-index.md", "index.mdx", "projet/"]
explore = false

[[chapter]]
name = "Lexique"
paths = ["00-lexique/"]
explore = false

[[chapter]]
name = "Fondations"
paths = ["01-fondations/"]

[[chapter]]
name = "Matériel"
paths = ["02-materiel/"]

[[chapter]]
name = "Stack logicielle"
paths = ["03-stack-logicielle/"]

[[chapter]]
name = "Blueprints et TCO"
paths = ["04-blueprints/"]

[[chapter]]
name = "Agents custodiens"
paths = ["05-agents-et-assistants-on-prem/agents-custodiens/"]

[[chapter]]
name = "Assistants personnels et souveraineté"
paths = ["05-agents-et-assistants-on-prem/"]

[[chapter]]
name = "Mise en œuvre"
paths = ["06-mise-en-oeuvre/"]
