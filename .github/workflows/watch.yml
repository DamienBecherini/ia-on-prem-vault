name: Vault weekly watch

# Collects what changed in the ecosystem (GitHub releases and security
# advisories, Hugging Face models, vendor and regulator feeds, watched pages
# such as price lists, the Vision IA YouTube channel as tier C signal) and
# opens one GitHub issue labelled "veille". The collection and its
# deterministic pre-triage are vault-watch-agent's (`vault-watch collect`,
# its reusable workflow collect.yml): the sources are in
# .agents/vault-maintenance/feeds.json, named by vault-watch.toml.
# vault-watch-agent then turns the issue into reviewed corrections and a PR.
# Never a required check.
#
# Cadence: the workflow runs every Monday, but the issue is opened every
# other week (even ISO weeks, 15-day window). On odd weeks it opens an issue
# only when a High / Critical advisory is not covered by a vault floor
# (version-floors.json); that issue gets the "urgent" label. A manual run
# always opens an issue.
on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, after the freshness workflow
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days"
        required: false
        default: "15"

permissions:
  contents: read
  issues: write
  actions: read # the watched pages are compared with the previous run's watch.json

jobs:
  cadence:
    name: Choose the window
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.cadence.outputs.days }}
      urgent_only: ${{ steps.cadence.outputs.urgent_only }}
    steps:
      - name: Choose the window
        id: cadence
        env:
          EVENT: ${{ github.event_name }}
          DAYS: ${{ inputs.days }}
        run: |
          week=$(date -u +%V)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$DAYS" in ''|*[!0-9]*) DAYS=15 ;; esac
            echo "days=$DAYS" >> "$GITHUB_OUTPUT"
            echo "urgent_only=false" >> "$GITHUB_OUTPUT"
          elif [ $((10#$week % 2)) -eq 0 ]; then
            echo "days=15" >> "$GITHUB_OUTPUT"
            echo "urgent_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "days=8" >> "$GITHUB_OUTPUT"
            echo "urgent_only=true" >> "$GITHUB_OUTPUT"
          fi

  watch:
    name: Collect ecosystem changes
    needs: cadence
    uses: DamienBecherini/vault-watch-agent/.github/workflows/collect.yml@v1.1.0
    with:
      days: ${{ fromJSON(needs.cadence.outputs.days) }}
      urgent_only: ${{ needs.cadence.outputs.urgent_only == 'true' }}
      label: veille
      title: Veille
      artifact: weekly-watch
