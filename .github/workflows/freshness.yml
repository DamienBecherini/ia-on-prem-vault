name: Vault freshness (weekly)

# Warn-only maintenance signal. Never a required check: it depends on the
# calendar (freshness) and on third-party hosts (sources), not on the PR.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Freshness and source health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pages due for review
        run: |
          # Reports go to $RUNNER_TEMP: a file written at the repo root would be scanned as a page.
          node scripts/audit-freshness.mjs --due-only --json="$RUNNER_TEMP/freshness.json" > "$RUNNER_TEMP/freshness.md"
          cat "$RUNNER_TEMP/freshness.md" >> "$GITHUB_STEP_SUMMARY"
          overdue=$(node -e "const r=require(process.env.RUNNER_TEMP+'/freshness.json');console.log(r.byStatus.overdue+r.byStatus['never-verified'])")
          if [ "$overdue" -gt 0 ]; then
            echo "::warning title=Freshness::$overdue page(s) overdue for review — see the job summary"
          fi
          claims=$(node -e "console.log(require(process.env.RUNNER_TEMP+'/freshness.json').claimsDue.length)")
          if [ "$claims" -gt 0 ]; then
            echo "::warning title=Watchlist::$claims claim(s) past their Recheck by date — see the job summary"
          fi

      - name: Cited sources health
        continue-on-error: true
        run: |
          node scripts/audit-sources.mjs --concurrency=6 --timeout=20000 --json="$RUNNER_TEMP/sources.json" > "$RUNNER_TEMP/sources.md"
          {
            echo ""
            echo "<details><summary>Source audit</summary>"
            echo ""
            cat "$RUNNER_TEMP/sources.md"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          dead=$(node -e "const r=require(process.env.RUNNER_TEMP+'/sources.json');const s=r.byStatus;console.log((s.dead||0)+(s['server-error']||0)+(s['network-error']||0)+(s.timeout||0))")
          if [ "$dead" -gt 0 ]; then
            echo "::warning title=Sources::$dead cited URL(s) dead or unreachable — see the job summary"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freshness-report
          path: |
            ${{ runner.temp }}/freshness.md
            ${{ runner.temp }}/freshness.json
            ${{ runner.temp }}/sources.md
            ${{ runner.temp }}/sources.json
          retention-days: 30
