name: Vault freshness (weekly)

# Warn-only maintenance signal. Never a required check: it depends on the
# calendar (freshness) and on third-party hosts (sources), not on the PR.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Freshness and source health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pages due for review
        run: |
          node scripts/audit-freshness.mjs --due-only --json=freshness.json > freshness.md
          cat freshness.md >> "$GITHUB_STEP_SUMMARY"
          overdue=$(node -e "const r=require('./freshness.json');console.log(r.byStatus.overdue+r.byStatus['never-verified'])")
          if [ "$overdue" -gt 0 ]; then
            echo "::warning title=Freshness::$overdue page(s) overdue for review — see the job summary"
          fi

      - name: Cited sources health
        continue-on-error: true
        run: |
          node scripts/audit-sources.mjs --concurrency=6 --timeout=20000 --json=sources.json > sources.md
          {
            echo ""
            echo "<details><summary>Source audit</summary>"
            echo ""
            cat sources.md
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          dead=$(node -e "const r=require('./sources.json');const s=r.byStatus;console.log((s.dead||0)+(s['server-error']||0)+(s['network-error']||0)+(s.timeout||0))")
          if [ "$dead" -gt 0 ]; then
            echo "::warning title=Sources::$dead cited URL(s) dead or unreachable — see the job summary"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freshness-report
          path: |
            freshness.md
            freshness.json
            sources.md
            sources.json
          retention-days: 30
