name: Vault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vault-audits:
    name: Vault quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run vault audit suite
        run: npm test

  link-audit:
    name: Internal link audit (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vault

      - uses: actions/checkout@v4
        with:
          repository: DamienBecherini/starlight-obsidian-engine
          path: engine

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine dependencies
        working-directory: engine
        run: npm ci

      - name: Audit wiki-links against vault
        working-directory: engine
        env:
          VAULT_PATH: ${{ github.workspace }}/vault
          FORCE_VAULT_PATH: "1"
        run: npm run audit:links
